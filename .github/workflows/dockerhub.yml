name: Publish ARM64 image to Docker Hub

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - app/**
      - tests/**
      - .github/workflows/dockerhub.yml
  workflow_dispatch:
    inputs:
      refresh_dependencies:
        description: Reinstall system dependencies without using the build cache
        type: boolean
        default: false

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Mask personal email metadata before third-party actions
        run: |
          python3 - <<'PY'
          import os, re
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = source.read()
          for email in set(re.findall(r"[\w.+%-]+@[\w.-]+\.[A-Za-z]{2,}", event)):
              print(f"::add-mask::{email}")
          PY
      - uses: actions/checkout@v4
      - name: Run reliability regression tests
        run: python3 -m unittest discover -s tests -v
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Build and publish with reusable dependency layers
        uses: docker/build-push-action@v6
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        with:
          context: .
          platforms: linux/arm64
          push: true
          # Inline cache survives between runners without a separate cache tag.
          # Keep the default compression so existing NAS layers remain reusable.
          cache-from: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/person-timelapse-nas:latest
          cache-to: type=inline
          no-cache: ${{ inputs.refresh_dependencies == true }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/person-timelapse-nas:latest
            ${{ env.DOCKERHUB_USERNAME }}/person-timelapse-nas:sha-${{ github.sha }}
