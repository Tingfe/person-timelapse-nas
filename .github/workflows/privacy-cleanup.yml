name: Clean flagged image metadata

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Rewrite flagged public tags, preserving their ARM64 runtime layers
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dockerhub-refs/heads/main
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preview or apply metadata cleanup
        env:
          APPLY: ${{ inputs.apply }}
          DOCKERHUB_USERNAME: ${{ inputs.apply && secrets.DOCKERHUB_USERNAME || '' }}
          DOCKERHUB_TOKEN: ${{ inputs.apply && secrets.DOCKERHUB_TOKEN || '' }}
        run: |
          if [ "$APPLY" = "true" ]; then
            python3 scripts/sanitize_image_attestations.py --apply
          else
            python3 scripts/sanitize_image_attestations.py
          fi
      - name: Read back and audit every public image tag
        if: ${{ inputs.apply == true }}
        run: python3 scripts/audit_public_images.py
