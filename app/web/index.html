<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>影像档案室</title>
  <style>
    :root{--ink:#1d2926;--paper:#f5f1e8;--line:#c5c1b6;--moss:#28604d;--sun:#e6673b;--cream:#fffdf7;--muted:#69736d;--gold:#edbd62}*{box-sizing:border-box}body{margin:0;background:linear-gradient(115deg,#ece7da,#f8f5ed 55%,#e6eee8);color:var(--ink);font:15px/1.5 "Avenir Next","PingFang SC",sans-serif}body:before{content:"";position:fixed;inset:0;opacity:.14;pointer-events:none;background-image:radial-gradient(#315047 .65px,transparent .7px);background-size:7px 7px}header{position:relative;padding:30px max(24px,calc((100vw - 1280px)/2));display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line)}.eyebrow{color:var(--moss);font-size:11px;font-weight:800;letter-spacing:.16em}.clock{font:12px monospace;color:var(--muted)}h1{font:clamp(38px,5vw,66px)/.88 "Iowan Old Style","Palatino Linotype",serif;letter-spacing:-.07em;margin:5px 0 0}main{position:relative;max-width:1280px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px}.panel{background:rgba(255,255,252,.76);border:1px solid var(--line);box-shadow:5px 6px 0 rgba(48,71,61,.08)}.panel h2{margin:0;padding:15px 18px;border-bottom:1px solid var(--line);font:700 17px "Iowan Old Style",serif}.mission{grid-column:1/-1;background:var(--ink);color:#f6f1e6;padding:20px 22px;display:grid;grid-template-columns:1fr auto;gap:20px;border-left:5px solid var(--sun);box-shadow:5px 6px 0 rgba(48,71,61,.18)}.mission.empty{border-left-color:var(--moss)}.mission b{font:700 19px "Iowan Old Style",serif}.mission small{color:#b7c5bd}.progress{height:8px;background:#42544d;margin:12px 0 6px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--sun));transition:width .35s}.metric{text-align:right;font:700 34px/1 "Iowan Old Style",serif}.metric small{display:block;font:11px monospace;color:#c6d3ca}.dates{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line)}button{font:inherit}.date{padding:15px;border:0;background:var(--paper);text-align:left;cursor:pointer;transition:.16s}.date:hover,.date.active{background:#dceade;transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--moss)}.date strong{display:block;font:600 17px "Iowan Old Style",serif}.date small{color:var(--muted)}.state{display:inline-block;margin:5px 0 2px;padding:2px 6px;border-radius:99px;font:800 10px/1.25 "Avenir Next","PingFang SC",sans-serif;letter-spacing:.03em;background:#e6e6df;color:#52625a}.state.completed{background:#b6d9be;color:#174d37}.state.partial{background:#f7d49d;color:#704f12}.state.scanning{background:#f3b3a0;color:#77341f}.state.queued{background:#d6e3ef;color:#31546e}.state.exported{background:#f8d9a0;color:#704509}.details{min-height:320px;padding:18px}.empty{color:var(--muted);padding:45px;text-align:center}.event{display:grid;grid-template-columns:112px 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}.event img{width:112px;height:68px;object-fit:cover;background:#d8d5ca}video{width:100%;max-height:360px;background:#17231f;margin:8px 0}.form{padding:18px;display:grid;gap:12px}label{display:grid;gap:5px;color:var(--muted);font-size:12px;font-weight:700}select,input{padding:10px;border:1px solid var(--line);background:white;color:var(--ink)}.camera-hint{margin-top:-7px;color:var(--moss);font-size:11px;font-weight:700}.range-picker{display:grid;gap:6px}.range-hint{font-size:11px;color:var(--moss);font-weight:800}.range-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.range-target{border:1px solid var(--line);padding:7px;background:var(--cream);color:var(--muted);font-size:11px;cursor:pointer}.range-target.active{background:var(--moss);border-color:var(--moss);color:white}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{border:0;padding:12px;color:white;background:var(--moss);font-weight:800;cursor:pointer}.action.export{background:var(--sun)}button:disabled{opacity:.45;cursor:not-allowed}.notice{margin:0 18px 18px;color:var(--sun);font-size:12px}.tasks,.timelapses{padding:8px 18px 18px;max-height:390px;overflow:auto}.task,.timelapse{padding:12px 0;border-bottom:1px dashed var(--line)}.task b,.timelapse b{font-size:13px}.task-detail{display:block;margin-top:5px;color:var(--muted);font:11px/1.4 monospace;white-space:pre-wrap;word-break:break-word}.tag{padding:2px 6px;border-radius:99px;font-size:10px;background:#e6e6df}.tag.running{background:#f7d49d}.tag.completed{background:#b6d9be}.tag.failed,.tag.cancelled,.tag.interrupted,.tag.blocked{background:#f2b6a5}.timelapse{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.timelapse small{display:block;color:var(--muted);font:11px monospace}.watch{padding:5px 8px;border:1px solid var(--moss);color:var(--moss);font-size:11px;font-weight:800;text-decoration:none;white-space:nowrap}.cancel{float:right;border:1px solid var(--sun);color:var(--sun);background:transparent;padding:3px 7px;cursor:pointer;font-size:11px}.mini{display:flex;justify-content:space-between;gap:8px;font:11px monospace;color:var(--muted);margin-top:6px}@media(max-width:800px){main{grid-template-columns:1fr}.mission{grid-template-columns:1fr}.metric{text-align:left}header{align-items:start;flex-direction:column;gap:12px}}
  </style>
</head>
<body>
  <header><div><div class="eyebrow">PRIVATE ARCHIVE · LOCAL NETWORK ONLY</div><h1>影像档案室</h1></div><div class="clock" id="clock"></div></header>
  <main>
    <section id="mission" class="mission empty"><div><b>等待你的第一项指令</b><div class="progress"><i style="width:0%"></i></div><small>选择日期并开始扫描，系统会显示实时进度和预计剩余时间。</small></div><div class="metric">—<small>NO ACTIVE TASK</small></div></section>
    <section class="panel"><h2>日期索引 <small id="dateCount"></small></h2><div class="dates" id="dates"></div><div class="details" id="details"><div class="empty">正在读取录像日期索引…</div></div></section>
    <aside>
      <section class="panel"><h2>新建任务</h2><div class="form"><label>开始日期<input id="dateSelect" type="date"></label><label>结束日期（扫描与延时均可选）<input id="endDate" type="date"></label><div class="range-picker"><span class="range-hint" id="rangeHint">点击日期：设置开始日期</span><div class="range-actions"><button class="range-target active" type="button" data-range-target="start">点日期设为开始</button><button class="range-target" type="button" data-range-target="end">点日期设为结束</button></div></div><label>摄像头<select id="cameraSelect"><option value="0">0 路</option><option value="10">10 路</option><option value="legacy">历史录像（无摄像头编号）</option></select></label><small class="camera-hint" id="cameraHint"></small><label>性能档位<select id="profile"><option value="archive">超极速（历史回放）· 120 秒抽帧 · 256px</option><option value="turbo" selected>极速（Z2 推荐）· 30 秒抽帧 · 320px</option><option value="balanced">平衡 · 10 秒抽帧 · 416px</option><option value="precise">精细 · 5 秒抽帧 · 640px</option></select></label><div class="actions"><button class="action" id="timelapse" style="grid-column:1/-1;background:#1d2926">一键人物延时</button><button class="action" id="scan">扫描范围人物</button><button class="action export" id="export">制作范围延时</button></div></div><p class="notice" id="notice">一键人物延时会自动扫描范围内尚未完成的日期，再合成为一条视频；下方两个按钮用于单独控制。</p></section>
      <section class="panel"><h2>任务队列 <small id="queueCount"></small></h2><div class="form"><button class="action" id="queueToggle">暂停队列</button><label style="display:flex;align-items:center;gap:8px"><input id="forceScan" type="checkbox"> 按所选档位重新扫描（替换该文件旧结果）</label><button class="range-target" id="refreshIndex">检查新增录像 / 刷新索引</button></div><div class="tasks" id="tasks"></div></section>
      <section class="panel"><h2>延时成片 <small id="timelapseCount"></small></h2><div class="timelapses" id="timelapses"></div></section>
    </aside>
  </main>
  <script>
    let overview={dates:[],tasks:[],profiles:{},diagnostics:{}},selected='',detailSignature='',rangeTarget='start',overviewLoading=false,statusLoading=false;
    const $=s=>document.querySelector(s),fmt=d=>`${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6)}`,inputDate=d=>`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6)}`;
    const time=s=>s==null?'计算中':s<60?`${Math.ceil(s)} 秒`:`${Math.floor(s/60)} 分 ${Math.ceil(s%60)} 秒`;
    const elapsed=(task,progress)=>Math.max(progress?.elapsed_seconds||0,task.started_at?(Date.now()-new Date(task.started_at).getTime())/1000:0,0);
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const statusText={queued:'等待中',running:'运行中',completed:'已完成',partial:'部分完成 · 有失败文件',failed:'失败',cancelled:'已取消',interrupted:'已中断',paused:'已暂停',blocked:'等待前置扫描修复'};
    const scanStateText=d=>{const count=d.total_files?` · ${d.processed_files}/${d.total_files} 文件`:'';return d.scan_status==='completed'?`已完成${count}`:d.scan_status==='partial'?`部分完成${count}`:d.scan_status==='scanning'?`扫描中${count}`:d.scan_status==='queued'?'已排队':'待扫描'};
    const rangeLabel=item=>item.start_date===item.end_date?fmt(item.start_date):`${fmt(item.start_date)} — ${fmt(item.end_date)}`;
    const fileSize=size=>size>=1024*1024*1024?`${(size/1024/1024/1024).toFixed(1)} GB`:`${Math.max(1,size/1024/1024).toFixed(1)} MB`;
    const setContent=(selector,html,bind)=>{const node=$(selector);if(node.innerHTML===html)return;node.innerHTML=html;if(bind)bind()};
    async function api(url,opts={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(url,{...opts,signal:controller.signal,cache:'no-store'});if(r.status===401){location.href='/login';throw Error('登录已过期')}const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}finally{clearTimeout(timer)}}
    function active(){return overview.tasks.find(t=>t.status==='running')}
    function render(){const run=active(),p=run?.progress||{},phase=run?.kind==='export'?'正在合成延时视频':p.phase==='starting'?'正在准备扫描':'正在扫描人物',d=overview.diagnostics||{},visible=overview.dates.slice(0,60),source=overview.indexing?`${d.message||'正在后台建立录像索引…'} 正在静默校验。`:d.available?`容器看到 ${d.mp4_files||0} 个 MP4，其中 ${d.recognized_files||0} 个文件名可识别。`:`${d.message||'录像源诊断尚未返回'}`;
      const mission=run?`<div><b>${phase} · ${fmt(run.date)}${run.camera?' · '+esc(run.camera)+'路':''}</b><div class="progress"><i style="width:${p.percent||0}%"></i></div><small>${esc(p.current_file||'正在准备文件…')}<br>文件 ${p.file_index||0}/${p.total_files||'?'} · 抽帧 ${p.samples||p.frames||0}/${p.estimated_samples||'?'} · YOLO ${p.yolo_inferences||0} 次 · ETA ${time(p.eta_seconds)}</small></div><div class="metric">${p.percent??0}%<small id="elapsed">${time(elapsed(run,p))} 已运行</small></div>`:`<div><b>${overview.queue_paused?'队列已暂停':overview.indexing?'正在建立录像索引':'等待下一项任务'}</b><div class="progress"><i style="width:${overview.indexing?35:0}%"></i></div><small>${esc(source)}</small></div><div class="metric">${overview.indexing?'…':'—'}<small>${overview.queue_paused?'PAUSED':overview.indexing?'INDEXING':'NO ACTIVE TASK'}</small></div>`;
      $('#mission').className='mission'+(run?'':' empty');setContent('#mission',mission);
      if(!selected)setContent('#details',`<div class="empty">${overview.dates.length?'点击日期查看人物事件与延时成片。':overview.indexing?'正在读取录像日期索引…':'暂无可用日期，请检查录像挂载或刷新索引。'}</div>`);
      $('#dateCount').textContent=overview.dates.length?`· 最近 60 / 共 ${overview.dates.length} 天`:'';
      const dates=visible.map(day=>`<button class="date ${day.date===selected?'active':''}" data-date="${day.date}"><strong>${fmt(day.date)}</strong><span class="state ${day.scan_status}">${scanStateText(day)}</span>${day.timelapse_count?`<span class="state exported">已成片 ${day.timelapse_count}</span>`:''}<small>${day.events?`${day.events} 个事件 · ${day.cameras.join('/')} 路`:'尚未检测到人物事件'}</small></button>`).join('')||`<div class="empty">${overview.indexing?'正在读取历史录像日期，完成后会自动显示。':`未建立日期索引。${source}`}</div>`;
      setContent('#dates',dates,()=>document.querySelectorAll('[data-date]').forEach(button=>button.onclick=()=>pickDate(button.dataset.date)));
      if(!$('#dateSelect').value&&overview.dates[0])$('#dateSelect').value=inputDate(overview.dates[0].date);
      $('#queueCount').textContent=`· 待执行 ${overview.queued_count??overview.tasks.filter(t=>t.status==='queued').length}`;
      $('#queueToggle').textContent=overview.queue_paused?'继续队列':'暂停队列';
      const tasks=overview.tasks.map(task=>{const q=task.progress||{},retry=['failed','partial','interrupted','blocked','paused'].includes(task.status);return `<div class="task"><b>${task.kind==='scan'?'人物扫描':'延时导出'} · ${fmt(task.date)}${task.dates?.length>1?' — '+fmt(task.dates.at(-1)):''}${task.camera?' · '+esc(task.camera)+'路':''}</b>${['running','queued','paused','blocked'].includes(task.status)?`<button class="cancel" data-cancel="${task.id}">取消</button>`:''}${retry?`<button class="watch" data-retry="${task.id}">重试 / 继续</button>`:''}<br><span class="tag ${task.status}">${statusText[task.status]||esc(task.status)}</span> <small>${task.created_at}</small>${task.status==='running'?`<div class="mini"><span>${esc(q.current_file||'准备中')}</span><span>${q.percent??0}%</span></div>`:''}${task.detail?`<small class="task-detail">${esc(task.detail)}</small>`:''}</div>`}).join('')||'<div class="empty">尚无任务</div>';
      setContent('#tasks',tasks,()=>{document.querySelectorAll('[data-cancel]').forEach(button=>button.onclick=()=>cancel(button.dataset.cancel));document.querySelectorAll('[data-retry]').forEach(button=>button.onclick=()=>retry(button.dataset.retry))});
      const items=overview.timelapses||[];$('#timelapseCount').textContent=items.length?`· ${items.length} 条`:'';
      const library=items.slice(0,12).map(item=>`<div class="timelapse"><div><b>${rangeLabel(item)} · ${item.camera} 路</b><small>${fileSize(item.size_bytes)} · ${item.created_at.replace('T',' ')}${item.status==='partial'?` · 部分完成（扫描失败 ${item.scan_failed_files||0}，读取失败 ${item.failed_files||0}）`:''}</small></div><a class="watch" target="_blank" rel="noopener" href="/media/${encodeURIComponent(item.name)}">立即观看</a></div>`).join('')||'<div class="empty">完成延时制作后，成片会显示在这里。</div>';
      setContent('#timelapses',library);const start=$('#dateSelect').value.replaceAll('-',''),end=$('#endDate').value.replaceAll('-','')||start,rangeCameras=[...new Set(overview.dates.filter(day=>day.date>=start&&day.date<=end).flatMap(day=>day.cameras.length?day.cameras:day.source_cameras||[]))],oldCamera=$('#cameraSelect').value,allCameras=[...new Set(['0','10','legacy',...rangeCameras])];setContent('#cameraSelect',allCameras.map(c=>`<option value="${esc(c)}">${c==='legacy'?'历史录像':esc(c)+' 路'}</option>`).join(''));$('#cameraSelect').value=rangeCameras.length===1?rangeCameras[0]:oldCamera||'0';$('#cameraHint').textContent=rangeCameras.length===1?'已按录像范围选择摄像头。':rangeCameras.length?'范围内有多个摄像头，请选择。':'';$('#scan').disabled=!start;$('#timelapse').disabled=!start;$('#export').disabled=!start}
    function setDateTarget(target){rangeTarget=target;$('#rangeHint').textContent=`点击日期：设置${target==='start'?'开始':'结束'}日期`;document.querySelectorAll('[data-range-target]').forEach(button=>button.classList.toggle('active',button.dataset.rangeTarget===target))}
    function pickDate(date){if(rangeTarget==='start')$('#dateSelect').value=inputDate(date);else $('#endDate').value=inputDate(date);showDate(date)}
    async function showDate(date,offset=0){selected=date;render();const data=await api('/api/date/'+date);if(date!==selected)return;const groups=data.events.events||{},events=Object.entries(groups).flatMap(([camera,list])=>list.map(event=>({...event,camera}))).sort((a,b)=>b.start.localeCompare(a.start)),page=events.slice(offset,offset+50),clips=data.exports.map(item=>`<video controls preload="metadata" src="/media/${encodeURIComponent(item.name)}"></video><small>${rangeLabel(item)} · ${item.camera} 路 · ${fileSize(item.size_bytes)}</small>`).join(''),rows=page.map(event=>`<div class="event"><img loading="lazy" src="/media/${event.thumbnail}" alt="事件缩略图"><div><b>${event.camera} 路 · ${event.start.slice(11)} — ${event.end.slice(11)}</b><br><small>检测命中 ${event.hits} 次</small></div></div>`).join(''),more=offset+page.length<events.length?`<button class="action" id="moreEvents">加载更多（已显示 ${offset+page.length}/${events.length}）</button>`:'';setContent('#details',`<h2>${fmt(date)} · 人物事件 ${events.length} 段</h2>${clips||''}<div>${rows||'<div class="empty">尚未扫描或没有检测到人物</div>'}</div>${more}`,()=>{const button=$('#moreEvents');if(button)button.onclick=()=>showDate(date,offset+50)});const day=overview.dates.find(item=>item.date===date);detailSignature=day&&`${day.events}:${day.ready}:${day.scan_status}:${day.timelapse_count}`}
    async function load(statusOnly=false){if(statusOnly?statusLoading:overviewLoading)return;if(statusOnly)statusLoading=true;else overviewLoading=true;try{overview={...overview,...await api(statusOnly?'/api/status':'/api/overview')};const day=overview.dates.find(item=>item.date===selected),signature=day&&`${day.events}:${day.ready}:${day.scan_status}:${day.timelapse_count}`;render();if(!statusOnly&&selected&&signature&&signature!==detailSignature)showDate(selected).catch(e=>$('#notice').textContent=e.message)}catch(error){$('#notice').textContent=error.name==='AbortError'?'服务暂未响应，保留当前内容，稍后自动重试。':error.message}finally{if(statusOnly)statusLoading=false;else overviewLoading=false}}
    async function task(kind){try{const date=$('#dateSelect').value.replaceAll('-',''),end_date=$('#endDate').value.replaceAll('-','');if(!date)throw Error('请选择开始日期');$('#notice').textContent='正在创建任务…';const result=await api('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,date,end_date,camera:$('#cameraSelect').value,profile:$('#profile').value,force:$('#forceScan').checked})});$('#notice').textContent=kind==='timelapse'?`一键计划已创建：先扫描 ${result.scan_created} 个日期，再合成 1 条范围延时视频。`:kind==='scan'?`已将 ${result.created} 个有录像的日期加入扫描队列。`:`已将 ${result.dates.length} 个日期的事件合并到延时任务。`;await load()}catch(error){$('#notice').textContent=error.message}}
    async function retry(id){try{await api('/api/tasks/'+id+'/retry',{method:'POST'});await load(true)}catch(error){$('#notice').textContent=error.message}}
    $('#queueToggle').onclick=async()=>{try{await api('/api/queue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:overview.queue_paused?'resume':'pause'})});await load(true)}catch(error){$('#notice').textContent=error.message}};
    $('#refreshIndex').onclick=async()=>{try{await api('/api/index',{method:'POST'});$('#notice').textContent='已请求在后台检查新增录像。';await load()}catch(error){$('#notice').textContent=error.message}};
    async function cancel(id){if(!confirm('确定停止当前任务吗？已完成的结果会保留。'))return;try{await api('/api/tasks/'+id,{method:'DELETE'});$('#notice').textContent='正在停止任务…';await load()}catch(error){$('#notice').textContent=error.message}}
    $('#timelapse').onclick=()=>task('timelapse');$('#scan').onclick=()=>task('scan');$('#export').onclick=()=>task('export');$('#dateSelect').onchange=()=>{const date=$('#dateSelect').value.replaceAll('-','');if(date)showDate(date).catch(e=>$('#notice').textContent=e.message)};$('#endDate').onchange=render;document.querySelectorAll('[data-range-target]').forEach(button=>button.onclick=()=>setDateTarget(button.dataset.rangeTarget));setDateTarget('start');setInterval(()=>load(true),2000);setInterval(()=>load(),20000);load();setInterval(()=>{const run=active();if(run&&$('#elapsed'))$('#elapsed').textContent=`${time(elapsed(run,run.progress))} 已运行`;$('#clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false})},1000);
  </script>
</body>
</html>
