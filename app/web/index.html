<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>影像档案室</title><link rel="stylesheet" href="/web/style.css"><script defer src="/web/app.js"></script>
</head>
<body>
  <header><div><div class="eyebrow">PRIVATE ARCHIVE · LOCAL NETWORK ONLY</div><h1>影像档案室</h1></div><div class="clock" id="clock"></div></header>
  <main>
    <section id="mission" class="mission empty" aria-label="当前执行状态"><div><b id="missionTitle">正在连接档案室…</b><div class="progress"><i id="missionBar"></i></div><small id="missionText">正在读取任务状态，不会重新扫描录像。</small></div><div class="metric"><span id="missionPercent">—</span><small id="elapsed">NO ACTIVE TASK</small></div></section>
    <section class="panel wide" aria-labelledby="plansHeading"><div class="panel-heading"><h2 id="plansHeading">范围任务 <small id="planCount"></small></h2><span class="subtle">扫描与合成分别计进度 · 已校验片段可续做</span></div><div id="plans" class="plans"></div><div id="planPager" class="pager"></div></section>
    <section class="panel archive" aria-labelledby="archiveHeading">
      <div class="panel-heading"><h2 id="archiveHeading">录像日历 <small id="dateCount"></small></h2><a class="text-link" href="#library">查看成片库 ↓</a></div>
      <div class="archive-tools"><label>年份<select id="yearSelect" aria-label="录像年份"></select></label><label>视图<select id="monthSelect" aria-label="录像月份"><option value="">全年总览</option></select></label><button class="quiet" id="selectMonth">选择整月</button><button class="quiet" id="selectYear">选择全年</button></div>
      <div id="archiveSummary" class="archive-summary"></div>
      <div class="legend"><span><i class="pending"></i>待扫描</span><span><i class="partial"></i>部分完成</span><span><i class="completed"></i>已扫描</span><span><i class="scanning"></i>执行中</span><span><i class="exported"></i>有成片</span></div>
      <div id="dates" class="dates"><div class="empty">正在读取录像日期索引…</div></div><div class="details" id="details"><div class="empty">选择一个录像日期，查看事件与成片。</div></div>
    </section>
    <aside>
      <section class="panel"><h2>新建任务</h2><div class="form">
        <label>开始日期<input id="dateSelect" type="date"></label><label>结束日期（可选）<input id="endDate" type="date"></label>
        <div class="range-picker"><span id="rangeHint" class="range-hint">点击日历：设置开始日期</span><div class="actions"><button class="range-target active" type="button" data-range-target="start">设为开始</button><button class="range-target" type="button" data-range-target="end">设为结束</button></div></div><small id="rangeSummary" class="subtle"></small>
        <label>摄像头<select id="cameraSelect"><option value="0">0 路</option><option value="10">10 路</option><option value="legacy">历史录像</option></select></label><small class="camera-hint" id="cameraHint"></small>
        <label>性能档位<select id="profile"><option value="archive">超极速 · 120 秒抽帧 · 256px</option><option value="turbo" selected>极速（Z2 推荐）· 30 秒 · 320px</option><option value="balanced">平衡 · 10 秒 · 416px</option><option value="precise">精细 · 5 秒 · 640px</option></select></label>
        <button class="action primary" id="timelapse">一键人物延时</button><div class="actions"><button class="action" id="scan">只扫描人物</button><button class="action export" id="export">只制作延时</button></div>
      </div><p class="notice" id="notice" role="status">一键任务会补扫未完成的日期，再合成一条范围视频。</p></section>
      <section class="panel queue"><h2>执行队列 <small id="queueCount"></small></h2><div class="form compact"><button class="action" id="queueToggle">暂停队列</button><label class="check"><input id="forceScan" type="checkbox"> 按所选档位重新扫描</label><button class="quiet" id="refreshIndex">检查新增录像 / 刷新索引</button></div><div class="tasks" id="tasks"></div><div class="pager" id="taskPager"></div></section>
    </aside>
    <section class="panel wide" id="library" aria-labelledby="libraryHeading">
      <div class="panel-heading"><h2 id="libraryHeading">延时成片库 <small id="timelapseCount"></small></h2><span class="subtle">按覆盖范围归档 · 原始录像不会被修改</span></div>
      <div class="library-tools"><label>年份<select id="libraryYear"><option value="">全部年份</option></select></label><label>月份<select id="libraryMonth" disabled><option value="">全部月份</option></select></label><label>摄像头<select id="libraryCamera"><option value="">全部摄像头</option></select></label><label class="search">搜索<input id="librarySearch" type="search" placeholder="日期、摄像头或文件名"></label></div>
      <div id="timelapses" class="timelapses"></div><div id="libraryPager" class="pager"></div>
    </section>
  </main>
  <dialog id="player"><div class="player-heading"><h2 id="playerTitle">延时成片</h2><button id="closePlayer" class="quiet">关闭</button></div><video id="playerVideo" controls playsinline preload="metadata"></video><p id="playerInfo" class="subtle"></p><a id="downloadVideo" class="watch" download>下载成片</a></dialog>
</body>
</html>
